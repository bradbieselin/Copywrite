<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DM Generator</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f5f5f5;
      color: #1a1a1a;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 2.5rem 1rem;
    }

    .card {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 2px 12px rgba(0,0,0,.08);
      padding: 2.5rem;
      width: 100%;
      max-width: 640px;
      height: fit-content;
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: .35rem;
    }

    .nav {
      display: flex;
      gap: .5rem;
      margin-bottom: 1.75rem;
      border-bottom: 1.5px solid #eee;
      padding-bottom: .75rem;
    }

    .nav-link {
      font-size: .8rem;
      font-weight: 600;
      color: #888;
      text-decoration: none;
      padding: .3rem .65rem;
      border-radius: 4px;
      transition: color .15s;
    }

    .nav-link:hover { color: #5b5bf8; }
    .nav-link.active { color: #5b5bf8; background: #f0f0ff; }

    .subtitle {
      color: #666;
      font-size: .9rem;
      margin-bottom: 2rem;
    }

    label {
      display: block;
      font-size: .85rem;
      font-weight: 600;
      margin-bottom: .4rem;
      color: #333;
    }

    textarea {
      width: 100%;
      border: 1.5px solid #ddd;
      border-radius: 8px;
      padding: .75rem 1rem;
      font-size: .95rem;
      font-family: inherit;
      resize: vertical;
      transition: border-color .15s;
      color: #1a1a1a;
      background: #fafafa;
    }

    textarea:focus {
      outline: none;
      border-color: #5b5bf8;
      background: #fff;
    }

    .field { margin-bottom: 1.25rem; }

    button[type="submit"] {
      width: 100%;
      padding: .85rem;
      background: #5b5bf8;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background .15s, transform .1s;
      margin-top: .25rem;
    }

    button[type="submit"]:hover  { background: #4a4ae0; }
    button[type="submit"]:active { transform: scale(.98); }

    .error {
      background: #fff3f3;
      border: 1.5px solid #f5a0a0;
      border-radius: 8px;
      padding: .85rem 1rem;
      color: #b00;
      font-size: .9rem;
      margin-top: 1.5rem;
      white-space: pre-wrap;
    }

    .result {
      margin-top: 1.75rem;
      border-top: 1.5px solid #eee;
      padding-top: 1.5rem;
    }

    .result-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: .75rem;
    }

    .result-label {
      font-size: .85rem;
      font-weight: 700;
      color: #5b5bf8;
      text-transform: uppercase;
      letter-spacing: .05em;
    }

    .copy-btn {
      font-size: .8rem;
      font-weight: 600;
      color: #5b5bf8;
      background: none;
      border: 1.5px solid #5b5bf8;
      border-radius: 6px;
      padding: .3rem .75rem;
      cursor: pointer;
      transition: background .15s, color .15s;
    }

    .copy-btn:hover { background: #5b5bf8; color: #fff; }

    .dm-text {
      font-size: .97rem;
      line-height: 1.65;
      color: #1a1a1a;
      background: #f8f8ff;
      border-radius: 8px;
      padding: 1rem 1.1rem;
      white-space: pre-wrap;
    }

    .word-count {
      margin-top: .5rem;
      font-size: .8rem;
      color: #888;
      text-align: right;
    }
  </style>
</head>
<body>
  <div class="card">
    <nav class="nav">
      <a href="/tools/dm" class="nav-link active">Cold DM Generator</a>
      <a href="/tools/intake" class="nav-link">Copy Generator</a>
      <a href="/tools/proposal" class="nav-link">Proposal Generator</a>
      <a href="/portal/admin" class="nav-link">← Admin</a>
    </nav>
    <h1>Cold DM Generator</h1>
    <p class="subtitle">Paste a brand's Instagram bio and a sample caption — get a personalised cold DM in seconds.</p>

    <form method="POST">
      <div class="field">
        <label for="bio">Brand bio</label>
        <textarea id="bio" name="bio" rows="3"
          placeholder="e.g. Clean skincare for sensitive skin. Founder-led. 🌿 Ships worldwide."
        >{{ bio }}</textarea>
      </div>

      <div class="field">
        <label for="caption">Sample caption</label>
        <textarea id="caption" name="caption" rows="5"
          placeholder="Paste a recent post caption here…"
        >{{ caption }}</textarea>
      </div>

      <button type="submit">Generate DM</button>
    </form>

    {% if error %}
      <div class="error">{{ error }}</div>
    {% endif %}

    {% if dm %}
      <div class="result">
        <div class="result-header">
          <span class="result-label">Your DM</span>
          <button class="copy-btn" onclick="copyDM()">Copy</button>
        </div>
        <div class="dm-text" id="dmText">{{ dm }}</div>
        <div class="word-count" id="wordCount"></div>
      </div>
    {% endif %}
  </div>

  <script>
    function copyDM() {
      const text = document.getElementById("dmText").innerText;
      const btn = document.querySelector(".copy-btn");
      navigator.clipboard.writeText(text).then(() => {
        btn.textContent = "Copied!";
        setTimeout(() => btn.textContent = "Copy", 1800);
      }).catch(() => {
        btn.textContent = "Copy failed";
        setTimeout(() => btn.textContent = "Copy", 1800);
      });
    }

    // Show word count for the generated DM
    const dmEl = document.getElementById("dmText");
    if (dmEl) {
      const words = dmEl.innerText.trim().split(/\s+/).filter(Boolean).length;
      document.getElementById("wordCount").textContent = words + " words";
    }
  </script>
</body>
</html>
