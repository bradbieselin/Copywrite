<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign In — Copywrite Portal</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background: #f5f5f5; }
    .login-wrap { max-width: 420px; margin: 6rem auto; }
  </style>
</head>
<body>

<div class="login-wrap px-3">
  <div class="text-center mb-4">
    <h4 class="fw-bold mb-1">Copywrite</h4>
    <p class="text-muted small mb-0">Client Portal</p>
  </div>

  <div class="card shadow-sm border-0">
    <div class="card-body p-4">
      <h5 class="fw-semibold mb-4">Sign in to your account</h5>

      {% if error %}
        <div class="alert alert-danger py-2 small">{{ error }}</div>
      {% endif %}

      <form method="POST" novalidate>
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <input type="hidden" name="next" value="{{ request.args.get('next', '') }}">

        <div class="mb-3">
          <label class="form-label fw-semibold" for="email">Email address</label>
          <input type="email" class="form-control" id="email" name="email"
                 autocomplete="email" required autofocus>
        </div>

        <div class="mb-4">
          <label class="form-label fw-semibold" for="password">Password</label>
          <input type="password" class="form-control" id="password" name="password"
                 autocomplete="current-password" required>
        </div>

        <div class="d-grid">
          <button type="submit" class="btn btn-dark btn-lg">Sign in</button>
        </div>
      </form>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
