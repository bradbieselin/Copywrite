{% extends "portal/base.html" %}
{% block title %}Account — CopyDTC Portal{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5">

    <h2 class="fw-bold mb-1">Account</h2>
    <p class="text-muted small mb-4">{{ session.user_email }}</p>

    <div class="card shadow-sm border-0">
      <div class="card-header bg-white border-bottom py-3 px-4">
        <h6 class="fw-bold mb-0">Change Password</h6>
      </div>
      <div class="card-body px-4 py-4">

        {% if error %}
          <div class="alert alert-danger py-2 small">{{ error }}</div>
        {% endif %}
        {% if success %}
          <div class="alert alert-success py-2 small">{{ success }}</div>
        {% endif %}

        <form method="POST" novalidate>
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
          <div class="mb-3">
            <label class="form-label fw-semibold" for="current_password">Current password</label>
            <input type="password" class="form-control" id="current_password"
                   name="current_password" required autofocus>
          </div>
          <div class="mb-3">
            <label class="form-label fw-semibold" for="new_password">New password</label>
            <input type="password" class="form-control" id="new_password"
                   name="new_password" required>
            <div class="form-text">Minimum 8 characters.</div>
          </div>
          <div class="mb-4">
            <label class="form-label fw-semibold" for="confirm_password">Confirm new password</label>
            <input type="password" class="form-control" id="confirm_password"
                   name="confirm_password" required>
          </div>
          <button type="submit" class="btn btn-dark w-100">Update Password</button>
        </form>

      </div>
    </div>

    <div class="mt-3 text-center">
      <a href="{{ url_for('portal_client.dashboard') }}" class="text-muted small">
        &larr; Back to My Briefs
      </a>
    </div>

  </div>
</div>
{% endblock %}
